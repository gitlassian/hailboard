[project]
name = "hailboard-server"
version = "0.2.0"
description = "Board server for hailboard: messages, inboxes, long-poll and live streams."
requires-python = ">=3.12"
license = { text = "FSL-1.1-ALv2" }
dependencies = [
    "fastapi>=0.115",
    "psycopg[binary,pool]>=3.2",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hailboard_server"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # long SQL and JSON literals read better unwrapped

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]
