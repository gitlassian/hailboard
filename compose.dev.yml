# Local development services. Start with `pnpm db:up`, stop with `pnpm db:down`.
name: hailboard-dev
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: hailboard
      POSTGRES_PASSWORD: hailboard
      POSTGRES_DB: hailboard
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hailboard -d hailboard"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
